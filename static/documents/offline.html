<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0c26">
    <title>Hors ligne — Dunia</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #f8fafc; color: #0f172a; font: 16px/1.6 system-ui, sans-serif; }
        main { width: min(100%, 32rem); padding: 2rem; text-align: center; background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; box-shadow: 0 20px 50px #0f172a12; }
        img { width: 4rem; height: 4rem; object-fit: contain; }
        h1 { margin: 1rem 0 .5rem; font-size: 1.6rem; }
        p { color: #64748b; }
        button { margin-top: 1rem; padding: .8rem 1.2rem; border: 0; border-radius: .8rem; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <img src="/static/images/logo-dunia.png" alt="Dunia">
        <h1>Vous êtes hors ligne</h1>
        <p>Les pages de votre compte restent protégées et ne sont pas enregistrées sur cet appareil. Reconnectez-vous à Internet pour reprendre votre apprentissage.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
