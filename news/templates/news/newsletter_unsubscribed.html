{% extends 'base.html' %}
{% block title %}Désinscription effectuée — {% endblock %}
{% block main %}
<section class="max-w-xl mx-auto px-4 py-16">
    <div class="bg-white border border-slate-100 rounded-3xl shadow-xl p-8 text-center">
        <div class="mx-auto w-16 h-16 rounded-full bg-slate-100 text-slate-600 grid place-items-center text-2xl"><i class="fa-solid fa-envelope"></i></div>
        <h1 class="text-2xl font-extrabold text-slate-900 mt-5">Désinscription enregistrée</h1>
        <p class="text-slate-600 mt-3">{{ subscriber.email }} ne recevra plus les e-mails de la newsletter Dunia.</p>
        <a href="{% url 'home:index' %}" class="inline-flex mt-7 rounded-xl bg-blue-600 px-5 py-3 font-bold text-white">Retour à l’accueil</a>
    </div>
</section>
{% endblock %}
