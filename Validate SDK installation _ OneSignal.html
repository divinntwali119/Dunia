    <!-- Set a light default before first paint. Keep THEME_BOOTSTRAP_STORAGE_KEY/LEGACY_STORAGE_KEY
         in sync with the constants of the same name in src/features/userPreferences/constants.ts,
         and this resolution logic in sync with readThemePreferenceFromStorage() /
         resolveDataTheme() in src/features/userPreferences/themeBootstrap.ts.
         The legacy fallback is a one-release migration aid; remove it once the legacy blob is
         fully retired. -->
    <script type="feb275449700bea14ea056bb-text/javascript">
      (function () {
        var THEME_BOOTSTRAP_STORAGE_KEY = "onesignal_theme_bootstrap_v1";
        var LEGACY_STORAGE_KEY = "onesignal_user_preferences_v1";
        // Keep in sync with PATHS.notificationPreview.index in src/shared/router/paths.ts.
        var LIGHT_THEME_LOCKED_PATH = "/notification-preview-iframe";
        var html = document.documentElement;

        // Default to light unless we read an explicit stored preference.
        html.dataset.theme = "light";

        // The marketing site embeds this route in an iframe from the dashboard origin, so
        // it shares localStorage with the logged-in dashboard. Lock it to light so a
        // user's dark theme preference never leaks into the public embed.
        if (window.location.pathname === LIGHT_THEME_LOCKED_PATH) {
          return;
        }

        try {
          var themePreference;

          // Parsed independently of the legacy fallback below (its own try/catch), matching
          // readThemePreferenceFromStorage()/readDedicatedThemeBootstrap() in themeBootstrap.ts: a
          // corrupt dedicated-key value must still fall through to the legacy blob rather than
          // aborting straight to the light default.
          var parsedBootstrap = null;
          try {
            var rawBootstrap = window.localStorage.getItem(THEME_BOOTSTRAP_STORAGE_KEY);
            parsedBootstrap = rawBootstrap ? JSON.parse(rawBootstrap) : null;
          } catch (bootstrapError) {
            parsedBootstrap = null;
          }

          if (parsedBootstrap === "light" || parsedBootstrap === "dark" || parsedBootstrap === "system") {
            themePreference = parsedBootstrap;
          } else {
            try {
              var rawLegacy = window.localStorage.getItem(LEGACY_STORAGE_KEY);
              var parsedLegacy = rawLegacy ? JSON.parse(rawLegacy) : null;
              var resolvedLegacy =
                parsedLegacy && typeof parsedLegacy === "object" && parsedLegacy.value
                  ? parsedLegacy.value
                  : parsedLegacy;
              themePreference = resolvedLegacy && resolvedLegacy.theme;
            } catch (legacyError) {
              themePreference = undefined;
            }
          }

          var systemPrefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

          if (themePreference === "dark") {
            html.dataset.theme = "dark";
          } else if (themePreference === "system") {
            // Only consult OS preference when the user explicitly chose System.
            html.dataset.theme = systemPrefersDark ? "dark" : "light";
          }
          // "light", missing, or unknown theme values keep the light default above.
        } catch (error) {
          // Leave the light default.
          html.dataset.theme = "light";
        }
      })();
    </script>
