# Free resources are only for a short-lived demo. Render's free Postgres
# expires after 30 days, has no backups, and is deleted after its 14-day grace
# period. Upgrade the database plan before storing production data.
databases:
  - name: dunia-postgres
    plan: free
    region: frankfurt
    databaseName: dunia
    user: dunia
    ipAllowList: []

services:
  - type: web
    name: dunia-web
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash build.sh
    startCommand: python -m gunicorn Dunia.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: dunia-postgres
          property: connectionString
      - key: USE_S3
        value: "True"
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
