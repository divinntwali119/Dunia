{% load static %}
<!-- BARRE DE NAVIGATION -->
<header id="mainHeader" class="bg-white sticky top-0 z-50 shadow-sm">
    <nav class="max-w-7xl mx-auto px-3 sm:px-4 md:px-8 py-2.5 sm:py-3 flex justify-between items-center">
        <a href="{% url 'home:index' %}" class="flex items-center gap-2 sm:gap-3 group">
            <img src="{% static 'images/logo-dunia.png' %}" alt="Dunia" class="logo-dunia">
            <div class="flex flex-col leading-none">
                <span class="brand-name">Dunia</span>
            </div>
        </a>

        <ul class="hidden lg:flex items-center gap-8 text-sm font-medium text-slate-700">
            <li><a href="{% url 'home:index' %}" class="{% if request.resolver_match.namespace == 'home' %}text-blue-600 font-semibold{% else %}hover:text-blue-600 transition{% endif %}">Accueil</a></li>
            <li><a href="{% url 'home:index' %}#about" class="hover:text-blue-600 transition">À propos</a></li>
            <li><a href="{% url 'formations:list' %}" class="{% if request.resolver_match.namespace == 'formations' %}text-blue-600 font-semibold{% else %}hover:text-blue-600 transition{% endif %}">Formations</a></li>
            <li><a href="{% url 'news:list' %}" class="{% if request.resolver_match.namespace == 'news' %}text-blue-600 font-semibold{% else %}hover:text-blue-600 transition{% endif %}">Actualités</a></li>
            <li><a href="{% url 'home:index' %}#contact" class="hover:text-blue-600 transition">Contact</a></li>
        </ul>

        <div class="flex items-center gap-2 sm:gap-3">
            <a href="https://wa.me/243962104398"
                class="hidden sm:inline-flex bg-blue-600 hover:bg-blue-700 text-white text-xs md:text-sm font-semibold px-4 md:px-6 py-2.5 rounded-lg shadow-md transition hover:scale-105">
                Rejoindre la communauté <i class="fa-solid fa-arrow-right ml-2"></i>
            </a>

            <button id="themeToggle" class="theme-toggle" aria-label="Basculer le thème">
                <svg class="icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                </svg>
                <svg class="icon-sun w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                </svg>
            </button>

            <button id="hamburgerBtn"
                class="lg:hidden text-slate-700 p-2.5 focus:outline-none hamburger rounded-lg active:bg-slate-100"
                aria-label="Menu" aria-expanded="false">
                <div class="w-6 h-5 flex flex-col justify-between">
                    <span class="hamburger-line w-full h-0.5 bg-slate-700 rounded-full"></span>
                    <span class="hamburger-line w-full h-0.5 bg-slate-700 rounded-full"></span>
                    <span class="hamburger-line w-full h-0.5 bg-slate-700 rounded-full"></span>
                </div>
            </button>
        </div>
    </nav>
</header>

<!-- MENU MOBILE -->
<div id="mobileOverlay"></div>
<div id="mobileMenu">
    <div class="flex items-center justify-between p-4 sm:p-5 border-b border-slate-100 safe-top">
        <div class="flex items-center gap-2 sm:gap-3">
            <img src="{% static 'images/logo-dunia.png' %}" alt="Dunia" class="logo-dunia">
            <span class="brand-name">Dunia</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="themeToggleMobile" class="theme-toggle" aria-label="Basculer le thème">
                <svg class="icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                </svg>
                <svg class="icon-sun w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                </svg>
            </button>
            <button id="closeMenuBtn"
                class="text-slate-500 hover:text-blue-600 p-2.5 transition rounded-lg active:bg-slate-100"
                aria-label="Fermer">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
    </div>

    <nav class="flex-1 p-4 sm:p-5 space-y-1">
        <a href="{% url 'home:index' %}" class="mobile-nav-link{% if request.resolver_match.namespace == 'home' %} active{% endif %}">
            <i class="fa-solid fa-house"></i>
            Accueil
        </a>
        <a href="{% url 'home:index' %}#about" class="mobile-nav-link">
            <i class="fa-solid fa-circle-info"></i>
            À propos
        </a>
        <a href="{% url 'formations:list' %}" class="mobile-nav-link{% if request.resolver_match.namespace == 'formations' %} active{% endif %}">
            <i class="fa-solid fa-graduation-cap"></i>
            Formations
        </a>
        <a href="{% url 'news:list' %}" class="mobile-nav-link{% if request.resolver_match.namespace == 'news' %} active{% endif %}">
            <i class="fa-solid fa-bullhorn"></i>
            Actualités
        </a>
        <a href="{% url 'home:index' %}#contact" class="mobile-nav-link">
            <i class="fa-solid fa-envelope"></i>
            Contact
        </a>
    </nav>

    <div class="p-4 sm:p-5 border-t border-slate-100 safe-bottom">
        <a href="https://wa.me/243962104398"
            class="w-full inline-flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-3.5 rounded-xl shadow-md transition active:scale-95">
            <i class="fa-brands fa-whatsapp text-lg"></i>
            Rejoindre la communauté
        </a>
        <div class="flex items-center justify-center gap-3 mt-5 text-slate-500">
            <a href="https://www.facebook.com/profile.php?id=61592556733317"
                class="w-11 h-11 bg-slate-50 hover:bg-blue-600 hover:text-white rounded-full flex items-center justify-center transition active:scale-90"><i
                    class="fa-brands fa-facebook-f"></i></a>
            <a href="#"
                class="w-11 h-11 bg-slate-50 hover:bg-blue-600 hover:text-white rounded-full flex items-center justify-center transition active:scale-90"><i
                    class="fa-brands fa-instagram"></i></a>
            <a href="#"
                class="w-11 h-11 bg-slate-50 hover:bg-blue-600 hover:text-white rounded-full flex items-center justify-center transition active:scale-90"><i
                    class="fa-brands fa-linkedin-in"></i></a>
            <a href="https://wa.me/243962104398"
                class="w-11 h-11 bg-slate-50 hover:bg-blue-600 hover:text-white rounded-full flex items-center justify-center transition active:scale-90"><i
                    class="fa-brands fa-whatsapp"></i></a>
        </div>
    </div>
</div>
