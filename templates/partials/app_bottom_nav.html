<nav id="appBottomNav" class="app-bottom-nav" aria-label="Navigation de l’application">
    <a href="{% url 'home:index' %}" {% if request.resolver_match.namespace == 'home' %}aria-current="page"{% endif %}>
        <i class="fa-solid fa-house" aria-hidden="true"></i><span>Accueil</span>
    </a>
    <a href="{% url 'formations:list' %}" {% if request.resolver_match.namespace == 'formations' and request.resolver_match.url_name != 'student_dashboard' %}aria-current="page"{% endif %}>
        <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i><span>Formations</span>
    </a>
    <a href="{% url 'news:notifications_settings' %}" {% if request.resolver_match.url_name == 'notifications_settings' %}aria-current="page"{% endif %}>
        <i class="fa-solid fa-bell" aria-hidden="true"></i><span>Alertes</span>
    </a>
    {% if user.is_authenticated %}
    <a href="{% url 'formations:student_dashboard' %}" {% if request.resolver_match.url_name == 'student_dashboard' %}aria-current="page"{% endif %}>
        <i class="fa-solid fa-user" aria-hidden="true"></i><span>Mon espace</span>
    </a>
    {% elif request.resolver_match.url_name == 'login' %}
    <a href="{% url 'formations:login' %}" aria-current="page">
        <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i><span>Me connecter</span>
    </a>
    {% else %}
    <a href="{% url 'formations:signup' %}" {% if request.resolver_match.url_name == 'signup' %}aria-current="page"{% endif %}>
        <i class="fa-solid fa-user-plus" aria-hidden="true"></i><span>M’inscrire</span>
    </a>
    {% endif %}
</nav>
